<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hero Section</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #fafafa;
      color: #111827;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Hero Section Container */
    .hero {
      max-width: 1200px;
      width: 100%;
      padding: 4rem 2rem;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 3rem;
      align-items: center;
    }

    /* Left Content */
    .hero-content {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 1.5rem;
    }

    .badge {
      display: inline-block;
      background-color: #eef2ff;
      color: #6366f1;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      padding: 0.4rem 0.8rem;
      border-radius: 9999px;
    }

    .hero-title {
      font-size: 3.5rem;
      line-height: 1.1;
      font-weight: 700;
      color: #0f172a;
      letter-spacing: -0.02em;
    }

    .hero-description {
      font-size: 1.125rem;
      line-height: 1.6;
      color: #64748b;
      max-width: 480px;
    }

    .cta-group {
      display: flex;
      gap: 1rem;
      margin-top: 0.5rem;
    }

    .btn-primary {
      background-color: #0f172a;
      color: #ffffff;
      padding: 0.75rem 1.5rem;
      border-radius: 0.5rem;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
      transition: background-color 0.2s ease;
    }

    .btn-primary:hover {
      background-color: #1e293b;
    }

    .btn-secondary {
      background-color: #ffffff;
      color: #334155;
      padding: 0.75rem 1.5rem;
      border-radius: 0.5rem;
      border: 1px solid #e2e8f0;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
      transition: border-color 0.2s ease, background-color 0.2s ease;
    }

    .btn-secondary:hover {
      background-color: #f8fafc;
      border-color: #cbd5e1;
    }

    /* Right Image Collage */
    .hero-gallery {
      position: relative;
      width: 100%;
      height: 480px;
    }

    .card {
      position: absolute;
      border-radius: 1rem;
      overflow: hidden;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.08), 0 8px 10px -6px rgba(0, 0, 0, 0.04);
      transition: transform 0.3s ease;
    }

    .card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .card:hover {
      transform: scale(1.03) !important;
      z-index: 10;
    }

    /* Card Positions & Rotations */
    .card-1 {
      width: 250px;
      height: 280px;
      top: 10%;
      left: 10%;
      transform: rotate(-3deg);
      z-index: 2;
    }

    .card-2 {
      width: 200px;
      height: 150px;
      top: 0%;
      right: 5%;
      transform: rotate(6deg);
      z-index: 1;
    }

    .card-3 {
      width: 190px;
      height: 150px;
      top: 40%;
      right: 10%;
      transform: rotate(-2deg);
      z-index: 3;
    }

    .card-4 {
      width: 210px;
      height: 140px;
      bottom: 2%;
      left: 25%;
      transform: rotate(4deg);
      z-index: 4;
    }

    /* Responsive Design */
    @media (max-width: 900px) {
      .hero {
        grid-template-columns: 1fr;
        text-align: center;
      }

      .hero-content {
        align-items: center;
      }

      .hero-title {
        font-size: 2.5rem;
      }

      .hero-gallery {
        height: 400px;
        margin-top: 2rem;
      }
    }
  </style>
</head>
<body>

  <section class="hero">
    <!-- Content Section -->
    <div class="hero-content">
      <span class="badge">ABOUT LEADVARO</span>
      <h1 class="hero-title">Making outbound<br />actually outbound.</h1>
      <p class="hero-description">
        Our vision is a world where every sales rep talks to the right person at the right time — without spending half their day chasing bad data.
      </p>
      <div class="cta-group">
        <a href="#" class="btn-primary">Read our story &rarr;</a>
        <a href="#" class="btn-secondary">Join the team</a>
      </div>
    </div>

    <!-- Image Collage Section -->
    <div class="hero-gallery">
      <div class="card card-1">
        <img src="https://images.unsplash.com/photo-1522071820081-009f0129c71c?auto=format&fit=crop&w=600&q=80" alt="Team collaborating" />
      </div>
      <div class="card card-2">
        <img src="https://images.unsplash.com/photo-1531482615713-2afd69097998?auto=format&fit=crop&w=600&q=80" alt="Office presentation" />
      </div>
      <div class="card card-3">
        <img src="https://images.unsplash.com/photo-1573496359142-b8d87734a5a2?auto=format&fit=crop&w=600&q=80" alt="Support call" />
      </div>
      <div class="card card-4">
        <img src="https://images.unsplash.com/photo-1560250097-0b93528c311a?auto=format&fit=crop&w=600&q=80" alt="Business handshake" />
      </div>
    </div>
  </section>

</body>
</html>
